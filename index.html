<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TManhios Key Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 class="title-glow">TMANHIOS KEY GENERATOR</h1>
        <p class="subtitle">Format: TManhios-[6hour|12hour|1hour|1day|7day|1month|forever]-XXXXXXXXXX</p>

        <div class="tabs">
            <button id="tab-gen" class="tab-btn active">TẠO KEY</button>
            <button id="tab-admin" class="tab-btn">QUẢN LÝ KEY</button>
            <button id="tab-seller" class="tab-btn">QUẢN LÝ SELLER</button>
        </div>

        <!-- ============================================================
             VIEW TẠO KEY
             ============================================================ -->
        <div id="view-gen" class="view">
            <div class="controls">
                <label>Số lượng:</label>
                <input type="number" id="amount" value="1" min="1" max="1000">

                <label>Độ dài suffix:</label>
                <input type="number" id="suffix-len" value="10" min="4" max="64">

                <label>Loại hạn:</label>
                <select id="duration">
                    <option value="21600000" selected>6 Giờ</option>
                    <option value="43200000">12 Giờ</option>
                    <option value="3600000">1 Giờ</option>
                    <option value="86400000">1 Ngày</option>
                    <option value="604800000">7 Ngày</option>
                    <option value="2592000000">1 Tháng (30 ngày)</option>
                    <option value="0">Vĩnh viễn</option>
                </select>

                <button id="btn-gen">TẠO KEY</button>
                <button id="btn-copy">COPY</button>
                <button id="btn-clear">XÓA</button>
            </div>

            <div class="output">
                <textarea id="result" readonly placeholder="Key sẽ hiện ở đây và tự lưu vào kho..."></textarea>
            </div>

            <div class="counter">
                <span id="count">0</span> key đã tạo trong phiên |
                <span id="ip-display">IP: đang lấy...</span>
            </div>
        </div>

        <!-- ============================================================
             VIEW QUẢN LÝ KEY
             ============================================================ -->
        <div id="view-admin" class="view" style="display:none">
            <div class="controls">
                <button id="btn-reload">TẢI LẠI</button>
                <button id="btn-clear-all">XÓA TẤT CẢ</button>
                <input type="text" id="search" placeholder="Tìm key...">
            </div>

            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>STT</th>
                            <th>KEY</th>
                            <th>IP</th>
                            <th>LOẠI</th>
                            <th>THỜI GIAN TẠO</th>
                            <th>CÒN LẠI</th>
                            <th>HÀNH ĐỘNG</th>
                        </tr>
                    </thead>
                    <tbody id="key-body"></tbody>
                </table>
            </div>

            <div class="counter">
                Tổng: <span id="total">0</span> key
            </div>
        </div>

        <!-- ============================================================
             VIEW QUẢN LÝ SELLER
             ============================================================ -->
        <div id="view-seller" class="view" style="display:none">
            <div class="controls">
                <label>Mật khẩu admin:</label>
                <input type="password" id="admin-pass" placeholder="Nhập mật khẩu admin...">
                <button id="btn-load-sellers">TẢI DANH SÁCH</button>
            </div>

            <div class="controls" style="border-top:1px dashed #333; padding-top:15px;">
                <label>Tạo seller:</label>
                <input type="text" id="new-username" placeholder="Username (>=4)">
                <input type="text" id="new-password" placeholder="Password (>=6)">
                <input type="text" id="new-prefix" placeholder="Prefix (VD: PDD-)" value="TManhios-">
                <input type="text" id="new-brand" placeholder="Tên web (VD: PDD STORE)" value="TMANHIOS SELLER">
                <input type="number" id="new-rental-value" placeholder="Thời gian" value="3" min="1">
                <select id="new-rental-unit">
                    <option value="minute">Phút</option>
                    <option value="hour">Giờ</option>
                    <option value="day">Ngày</option>
                    <option value="month" selected>Tháng</option>
                </select>
                <input type="number" id="new-quota" placeholder="Quota/ngày" value="100" min="1" max="10000">
                <button id="btn-create-seller">TẠO SELLER</button>
            </div>

            <div class="table-wrap" style="margin-top:15px">
                <table>
                    <thead>
                        <tr>
                            <th>STT</th>
                            <th>USERNAME</th>
                            <th>PREFIX</th>
                            <th>TÊN WEB</th>
                            <th>TRẠNG THÁI</th>
                            <th>HẾT HẠN</th>
                            <th>QUOTA</th>
                            <th>NGÀY TẠO</th>
                            <th>HÀNH ĐỘNG</th>
                        </tr>
                    </thead>
                    <tbody id="seller-body"></tbody>
                </table>
            </div>

            <div class="counter">
                Tổng: <span id="seller-total">0</span> seller
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
